name: "fetch lark docs (manual)"
on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
      card_stages: ${{ steps.card.outputs.card_stages }}
      card_title: ${{ steps.card.outputs.card_title }}
    steps:
    - name: get current date
      id: date
      run: echo "::set-output name=date::$(date +'%Y%m%d')"
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: install deps & create card
      id: card
      run: |
        yarn
        npx docusaurus report-to-lark --card-create --title "构建中文文档" --stages "获取用户指南,构建文档站点,检查链接,获取参考文档,构建参考文档,检查参考链接"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: fetch docs
      run: |
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -oss
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -post
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -oss -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -post
        npx docusaurus fetch-lark-docs -man onpremise -tar paas -oss
        npx docusaurus fetch-lark-docs -man onpremise -tar paas -post
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        OSS_REGION: ${{ vars.OSS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
    - name: build docsite
      run: |
        npm run build
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: check links
      run: |
        npx docusaurus link-checks
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
    - name: fetch sdk references
      id: fetch_sdk_refs
      run: |
        npx docusaurus fetch-lark-docs -man python -src-only
        npx docusaurus fetch-lark-docs -man pymilvus25 -src-only
        npx docusaurus fetch-lark-docs -man pymilvus26 -tar zilliz -oss
        npx docusaurus fetch-lark-docs -man pymilvus26 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man javaV2 -src-only
        npx docusaurus fetch-lark-docs -man javaV225 -src-only
        npx docusaurus fetch-lark-docs -man javaV226 -tar zilliz -oss
        npx docusaurus fetch-lark-docs -man javaV226 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man node -src-only
        npx docusaurus fetch-lark-docs -man nodejs25 -src-only
        npx docusaurus fetch-lark-docs -man nodejs26 -tar zilliz -oss
        npx docusaurus fetch-lark-docs -man nodejs26 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man gov2 -src-only
        npx docusaurus fetch-lark-docs -man gov226 -tar zilliz -oss
        npx docusaurus fetch-lark-docs -man gov226 -tar zilliz -post
        npx docusaurus fetch-apifox-docs -s plugins/apifox-docs/meta/openapi.json -l zh-CN
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        OSS_REGION: ${{ vars.OSS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
    - name: build docsite
      run: |
        npm run build
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: link checks
      run: |
        npx docusaurus link-checks
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
  failure:
    needs: fetch
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: report failure
      run: |
        yarn
        npx docusaurus report-to-lark --card-finish --message-id "${{ needs.fetch.outputs.card_id }}" --status fail --title "构建中文文档" --stages "${{ needs.fetch.outputs.card_stages }}" --started-at "${{ needs.fetch.outputs.card_started_at }}"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
  success:
    needs: fetch
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: report success
      run: |
        yarn
        npx docusaurus report-to-lark --card-finish --message-id "${{ needs.fetch.outputs.card_id }}" --status success --title "构建中文文档" --stages "${{ needs.fetch.outputs.card_stages }}" --started-at "${{ needs.fetch.outputs.card_started_at }}"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
